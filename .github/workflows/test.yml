name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Poetry
        run: |
          pip install --no-cache-dir poetry
      - name: Install dependencies
        run: |
          poetry install --no-interaction
      - name: Run tests
        run: |
          poetry run pytest -q
