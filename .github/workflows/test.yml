name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry==1.7.1
      - name: Verify lockfile
        run: poetry check --lock
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --with torch --with dev --no-interaction
      - name: Run tests
        run: pytest --cov=entropy_news --cov-fail-under=85 -q
