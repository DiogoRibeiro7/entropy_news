name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix, for example 0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry==1.7.1
      - name: Verify release request
        run: |
          test "$GITHUB_REF_NAME" = "main" || {
            echo "Release workflow must be dispatched from main, got $GITHUB_REF_NAME"
            exit 1
          }
          PACKAGE_VERSION="$(poetry version -s)"
          test "$PACKAGE_VERSION" = "${{ inputs.version }}" || {
            echo "Requested version ${{ inputs.version }} does not match package version $PACKAGE_VERSION"
            exit 1
          }
          poetry check --lock
      - name: Resolve release tag
        id: release_tag
        run: |
          TAG="v${{ inputs.version }}"
          git fetch --tags --force
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
            git merge-base --is-ancestor "$TAG_COMMIT" origin/main || {
              echo "Existing tag $TAG does not point to an ancestor of main"
              exit 1
            }
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out existing release tag
        if: steps.release_tag.outputs.created == 'false'
        run: git checkout --detach "v${{ inputs.version }}"
      - name: Verify release source
        run: |
          PACKAGE_VERSION="$(poetry version -s)"
          test "$PACKAGE_VERSION" = "${{ inputs.version }}" || {
            echo "Release source version $PACKAGE_VERSION does not match requested version ${{ inputs.version }}"
            exit 1
          }
          poetry check --lock
      - name: Build package preflight
        run: poetry build
      - name: Create and push annotated tag
        if: steps.release_tag.outputs.created == 'true'
        run: |
          TAG="v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Entropy News $TAG"
          git push origin "$TAG"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
