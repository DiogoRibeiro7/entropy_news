name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix, for example 0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry==1.7.1
      - name: Verify lockfile
        run: poetry check --lock
      - name: Verify requested version
        run: |
          PACKAGE_VERSION="$(poetry version -s)"
          test "$PACKAGE_VERSION" = "${{ inputs.version }}" || {
            echo "Requested version ${{ inputs.version }} does not match package version $PACKAGE_VERSION"
            exit 1
          }
      - name: Verify main is release source
        run: |
          test "$GITHUB_REF_NAME" = "main" || {
            echo "Release workflow must be dispatched from main, got $GITHUB_REF_NAME"
            exit 1
          }
      - name: Verify tag does not already exist
        run: |
          TAG="v${{ inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi
      - name: Build package preflight
        run: poetry build
      - name: Create and push annotated tag
        run: |
          TAG="v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Entropy News $TAG"
          git push origin "$TAG"
