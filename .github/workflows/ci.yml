name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry==1.7.1
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --with torch --with dev
      - name: Run unit tests
        run: pytest -q

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry==1.7.1
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --with torch --with dev
      - name: Run integration tests
        run: pytest -m integration -q

  performance:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry==1.7.1
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --with torch --with dev
      - name: Run performance tests
        run: pytest -m performance -q
