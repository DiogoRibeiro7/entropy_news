name: Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  validation:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            coverage: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Poetry
        run: pip install poetry==1.7.1
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --with torch --with dev
      - name: Run core test suite
        run: |
          set -o pipefail
          if [ "${{ matrix.coverage }}" = "true" ]; then
            pytest --cov=entropy_news --cov-report=xml --cov-report=term --cov-fail-under=85 -q | tee pytest-report.txt
          else
            pytest -q | tee pytest-report.txt
          fi
      - name: Enforce paper-reproduction coverage
        if: matrix.coverage == true
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          targets = {
              "entropy_news/paper_reproduction.py",
              "entropy_news/paper_rolling.py",
          }
          root = ET.parse("coverage.xml").getroot()
          covered = 0
          total = 0
          found = set()

          for cls in root.findall(".//class"):
              filename = cls.attrib.get("filename", "").replace("\\", "/")
              matched = next(
                  (
                      target
                      for target in targets
                      if filename.endswith(target)
                      or filename.endswith(target.removeprefix("entropy_news/"))
                  ),
                  None,
              )
              if matched is None:
                  continue
              found.add(matched)
              lines = cls.find("lines")
              if lines is None:
                  continue
              for line in lines.findall("line"):
                  total += 1
                  if int(line.attrib.get("hits", "0")) > 0:
                      covered += 1

          missing = targets - found
          if missing:
              raise SystemExit(f"Missing paper modules from coverage.xml: {sorted(missing)}")
          if total == 0:
              raise SystemExit("No executable paper-module lines found in coverage.xml")

          percentage = 100.0 * covered / total
          print(
              f"Paper-reproduction coverage: {covered}/{total} "
              f"({percentage:.2f}%)"
          )
          if percentage < 87.0:
              sys.exit(
                  f"Paper-reproduction coverage {percentage:.2f}% is below 87.00%"
              )
          PY
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.os }}
          path: pytest-report.txt
      - name: Upload coverage report
        if: matrix.coverage == true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml

  integration:
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry==1.7.1
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --with torch --with dev
      - name: Run integration tests
        run: |
          set -o pipefail
          pytest -m integration -q | tee integration-report.txt
      - name: Upload integration report
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: integration-report.txt

  performance:
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry==1.7.1
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --with torch --with dev
      - name: Run performance checks
        run: |
          set -o pipefail
          pytest -m performance -q | tee performance-report.txt
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.txt
