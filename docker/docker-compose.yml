version: "3.10"
services:
  forecast:
    build: ..
    command: ["--help"]
    working_dir: /app
    volumes:
      - ../output:/workspace/output
    environment:
      - PYTHONPATH=/app
  orchestrator:
    build: ..
    command:
      [
        "python",
        "-m",
        "entropy_news.model.orchestration",
        "--enable-metrics",
        "--metrics-port",
        "9100",
      ]
    working_dir: /app
    ports:
      - "9090:9090"
      - "9100:9100"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ../monitoring:/workspace/monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9091:9090"
    depends_on:
      - orchestrator
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=entropy
    ports:
      - "3000:3000"
    volumes:
      - ../monitoring/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/entropy.json:ro
    depends_on:
      - prometheus
