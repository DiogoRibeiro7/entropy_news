[tool.poetry]
name = "entropy-news"
version = "0.1.0"
description = "Financial-news entropy with a paper-faithful New News is Bad News reproduction path and research extensions."
authors = ["Diogo Ribeiro (DiogoRibeiro7) <dfr@esmad.ipp.pt>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "entropy_news" }]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0"
tqdm = "^4.66"
numpy = ">=1.25,<3.0"
prometheus-client = "^0.17"

[tool.poetry.group.torch.dependencies]
torch = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.1"
hypothesis = "^6.91"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.0"
myst-parser = "^2.0"
sphinx-rtd-theme = "^2.0"

[tool.poetry.scripts]
entropy-news-train = "entropy_news.main:main"
entropy-news-forecast = "entropy_news.main_forecast:main"
entropy-news-rolling = "entropy_news.rolling_train_forecast:main"
entropy-news-paper = "entropy_news.paper_rolling:main"
entropy-news-eval = "entropy_news.main_evaluate:main"
entropy-news-orchestrate = "entropy_news.model.orchestration:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
